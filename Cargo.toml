[package]
name = "scroder"
version = "0.2.0"
edition = "2021"
description = "A fast, minimal, high-quality screen recorder for Windows, macOS and Linux"
authors = ["Scroder"]
license = "MIT"
build = "build.rs"
repository = "https://github.com/YasinCoder0x0/scroder"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "clipboard",
    "x11",
    "wayland",
] }
egui = "0.37.0"
parking_lot = "0.13.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# ---------------------------------------------------------------------------
# Windows: native Windows Graphics Capture + Media Foundation + WASAPI backend
# ---------------------------------------------------------------------------
[target.'cfg(windows)'.dependencies]
wasapi = "0.27.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_Properties",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
] }
windows-capture = "2.0.1"

# ---------------------------------------------------------------------------
# macOS + Linux: FFmpeg based backend
# ---------------------------------------------------------------------------
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
global-hotkey = "0.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = [
    "async-io",
    "screencast",
    "screenshot",
] }
pollster = "0.4.0"
x11rb = { version = "0.13.2", features = ["randr", "resource_manager"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# ---------------------------------------------------------------------------
# Linux packages (cargo deb / cargo generate-rpm)
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "scroder"
maintainer = "Scroder"
copyright = "2026, Scroder"
license-file = ["LICENSE", "0"]
extended-description = """\
Scroder records your screen, a single window or a region with system audio, \
microphone and an optional webcam overlay. On Wayland desktops it uses the \
standard screen-sharing portal."""
section = "video"
priority = "optional"
depends = "$auto, ffmpeg"
recommends = "gstreamer1.0-tools, gstreamer1.0-pipewire, pulseaudio-utils | pipewire-pulse, xdg-desktop-portal"
assets = [
    ["target/release/scroder", "usr/bin/scroder", "755"],
    ["packaging/linux/scroder.desktop", "usr/share/applications/scroder.desktop", "644"],
    ["resources/icon_256.png", "usr/share/icons/hicolor/256x256/apps/scroder.png", "644"],
    ["packaging/linux/scroder.metainfo.xml", "usr/share/metainfo/scroder.metainfo.xml", "644"],
]

[package.metadata.generate-rpm]
name = "scroder"
assets = [
    { source = "target/release/scroder", dest = "/usr/bin/scroder", mode = "755" },
    { source = "packaging/linux/scroder.desktop", dest = "/usr/share/applications/scroder.desktop", mode = "644" },
    { source = "resources/icon_256.png", dest = "/usr/share/icons/hicolor/256x256/apps/scroder.png", mode = "644" },
    { source = "packaging/linux/scroder.metainfo.xml", dest = "/usr/share/metainfo/scroder.metainfo.xml", mode = "644" },
]

[package.metadata.generate-rpm.requires]
# File dependency: satisfied by both Fedora's ffmpeg-free and RPM Fusion's ffmpeg.
"/usr/bin/ffmpeg" = "*"
